<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a Call Moves · Horry Electric Cooperative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Presenter page for the Nov 4 demo: the call-flow step-through only, self-contained (works
     opened from disk or served at /horry/call-flow.html). Keys: ← → step, Space play/pause,
     1-5 pick a situation. Mirrors docs/demo-overview.html §2 — keep the two in step. */
  :root {
    --bg: #f6f5f0; --fg: #1b2230; --muted: #5d6679; --line: #c8ccd6; --panel: #ffffff;
    --accent: #b4540c; --accent-soft: #fbe8d6;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  .page { min-height: 100%; max-width: 1280px; margin: 0 auto; padding: 28px 32px 24px; display: grid; gap: 18px;
    grid-template-rows: auto auto 1fr auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 4px 0 0; font-size: clamp(26px, 3vw, 36px); font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: inherit; font-size: 15px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  button:disabled { opacity: .4; cursor: default; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; place-items: center; min-height: 0; }
  .sheet svg { width: 100%; height: auto; max-height: 62vh; display: block; }
  .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; transition: fill .25s, stroke .25s; }
  .node.on rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
  .node .t { fill: var(--fg); font: 600 15px var(--sans); }
  .node .s { fill: var(--muted); font: 400 11.5px var(--mono); }
  .edge { fill: none; stroke: var(--muted); stroke-width: 1.6; }
  .edge.on { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 8 6; animation: flow .7s linear infinite; }
  .elabel { fill: var(--muted); font: 400 11.5px var(--mono); }
  .arrowhead { fill: var(--muted); }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  .bottom { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
  .caption { font-size: clamp(18px, 1.7vw, 23px); line-height: 1.45; max-width: 70ch; min-height: 3em; margin: 0; }
  .caption .eyebrow { display: block; margin-bottom: 4px; font-size: 12px; }
  .stepbar { display: flex; gap: 10px; }
  .dots { display: flex; gap: 6px; margin-top: 10px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--accent); }
  .hint { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; margin-top: 8px; }
  @media (max-width: 760px) {
    .page { padding: 16px; }
    .bottom { grid-template-columns: 1fr; }
    .sheet { overflow-x: auto; place-items: start; }
    .sheet svg { min-width: 760px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <div class="eyebrow">Horry Electric Cooperative · Webex Contact Center</div>
      <h1>How a call moves</h1>
    </div>
    <div class="eyebrow">Workflow Concepts</div>
  </header>

  <div class="controls" id="scenarios" role="group" aria-label="Situations"></div>

  <div class="sheet">
    <svg viewBox="0 0 1000 410" role="img" aria-label="Call path from the member through Webex Contact Center, the WFC AI Controller and the WFC AI Agent, with the Horry service, NextGen CIS, text messages and the live agent desktop">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <path class="edge" id="e-sup-wxcc" d="M255 92 L255 168" marker-end="url(#ah)"/>
      <text class="elabel" x="263" y="135">Savannah on</text>
      <path class="edge" id="e-caller-wxcc" d="M142 200 L178 200" marker-end="url(#ah)"/>
      <path class="edge" id="e-wxcc-fs" d="M332 200 L348 200" marker-end="url(#ah)"/>
      <path class="edge" id="e-fs-el" d="M532 200 L568 200" marker-end="url(#ah)"/>
      <path class="edge" id="e-el-svc" d="M645 168 L645 92" marker-end="url(#ah)"/>
      <text class="elabel" x="653" y="135">tools</text>
      <path class="edge" id="e-svc-cis" d="M722 60 L788 60" marker-end="url(#ah)"/>
      <path class="edge" id="e-svc-sms" d="M722 78 L800 168" marker-end="url(#ah)"/>
      <path class="edge" id="e-wxcc-agent" d="M255 232 L255 318" marker-end="url(#ah)"/>
      <text class="elabel" x="263" y="280">queue</text>
      <path class="edge" id="e-el-back" d="M645 232 L645 350 L334 350" marker-end="url(#ah)"/>
      <text class="elabel" x="370" y="342">hand back with what Savannah collected</text>
      <path class="edge" id="e-cis-agent" d="M962 60 L982 60 L982 380 L334 380" marker-end="url(#ah)"/>
      <text class="elabel" x="560" y="398">account and billing on the agent's screen</text>

      <g class="node" id="n-sup"><rect x="180" y="30" width="150" height="62" rx="6"/><text class="t" x="196" y="56">Supervisor</text><text class="s" x="196" y="76">AI Operations page</text></g>
      <g class="node" id="n-caller"><rect x="20" y="170" width="120" height="62" rx="6"/><text class="t" x="36" y="196">Member</text><text class="s" x="36" y="216">calls in</text></g>
      <g class="node" id="n-wxcc"><rect x="180" y="170" width="150" height="62" rx="6"/><text class="t" x="196" y="196">WxCC flow</text><text class="s" x="196" y="216">checks AI switch</text></g>
      <g class="node" id="n-fs"><rect x="350" y="170" width="180" height="62" rx="6"/><text class="t" x="364" y="196">WFC AI Controller</text><text class="s" x="364" y="216">bridge to the AI</text></g>
      <g class="node" id="n-el"><rect x="570" y="170" width="150" height="62" rx="6"/><text class="t" x="586" y="196">Savannah (AI)</text><text class="s" x="586" y="216">WFC AI Agent</text></g>
      <g class="node" id="n-svc"><rect x="570" y="30" width="150" height="62" rx="6"/><text class="t" x="586" y="56">Horry service</text><text class="s" x="586" y="76">outages · payments</text></g>
      <g class="node" id="n-cis"><rect x="790" y="30" width="170" height="62" rx="6"/><text class="t" x="806" y="56">NextGen CIS</text><text class="s" x="806" y="76">accounts · billing</text></g>
      <g class="node" id="n-sms"><rect x="790" y="170" width="170" height="62" rx="6"/><text class="t" x="806" y="196">Texts</text><text class="s" x="806" y="216">restored · pay link</text></g>
      <g class="node" id="n-agent"><rect x="180" y="320" width="150" height="62" rx="6"/><text class="t" x="196" y="346">Live agent</text><text class="s" x="196" y="366">desktop widgets</text></g>
    </svg>
  </div>

  <div class="bottom">
    <div>
      <p class="caption" id="caption" aria-live="polite"></p>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
    <div>
      <div class="stepbar">
        <button id="back" type="button">Back</button>
        <button id="next" type="button">Next step</button>
        <button id="play" type="button">Play</button>
      </div>
      <div class="hint">← → step · space play · 1–5 situation</div>
    </div>
  </div>
</div>

<script>
  const scenarios = [
    { name: '1 · Agent hands a payment to Savannah', steps: [
      { nodes: ['caller', 'wxcc', 'agent'], edges: ['e-caller-wxcc', 'e-wxcc-agent'], text: 'Savannah is off. Dorothy calls and goes straight to the billing agent.' },
      { nodes: ['agent', 'cis'], edges: ['e-cis-agent'], text: 'The Member tab pops her account: $194 past due, the due date in red. She wants to pay.' },
      { nodes: ['agent', 'svc'], edges: [], text: 'The agent clicks Hand payment to Savannah and transfers the call to the payment entry point. The service has recorded the hand-off under a 4-digit reference.' },
      { nodes: ['wxcc', 'fs', 'el', 'svc'], edges: ['e-wxcc-fs', 'e-fs-el', 'e-el-svc'], text: 'The payment flow looks up the hand-off and bridges to Savannah. She already knows the member and the amount, asks "card on file, e-check on file, or a new card?", and reports each step to the service.' },
      { nodes: ['svc', 'agent'], edges: ['e-cis-agent'], text: "The agent's Calls page keeps the member on screen and shows the steps as they happen: Savannah answered, payment approved, confirmation number." },
      { nodes: ['el', 'fs', 'wxcc'], edges: ['e-el-back'], text: 'Done. Savannah hangs up her side; the flow continues and uses Queue To Agent with the email from the hand-off.' },
      { nodes: ['wxcc', 'agent'], edges: ['e-wxcc-agent'], text: 'The same agent gets the call back with the payment on screen and finishes the conversation.' }
    ]},
    { name: '2 · Storm: outage known', steps: [
      { nodes: ['sup', 'wxcc'], edges: ['e-sup-wxcc'], text: 'The supervisor turns Savannah on on the AI Operations page. The flow now sends members to her.' },
      { nodes: ['caller', 'wxcc'], edges: ['e-caller-wxcc'], text: 'Linda calls. The flow sees the switch is on and looks up who is calling.' },
      { nodes: ['wxcc', 'fs', 'el'], edges: ['e-wxcc-fs', 'e-fs-el'], text: 'The WFC AI Controller connects the call to Savannah. She greets Linda by name and confirms the service address.' },
      { nodes: ['el', 'svc', 'cis'], edges: ['e-el-svc', 'e-svc-cis'], text: '"I see there is an outage in your area. Is this the reason for your call?" Yes: Socastee, 1,240 members, a tree on the line, about 2½ hours.' },
      { nodes: ['el', 'svc', 'sms'], edges: ['e-el-svc', 'e-svc-sms'], text: 'Linda asks for a text when the power is back. She gets one if the estimate changes and another when it is restored. She could ask for a person at any point.' },
      { nodes: ['el'], edges: [], text: 'Savannah wraps up and hangs up. No agent was needed, and the call shows on Customer Review with a summary and sentiment.' }
    ]},
    { name: '2 · Storm: wire down, to a person', steps: [
      { nodes: ['caller', 'wxcc', 'fs', 'el'], edges: ['e-caller-wxcc', 'e-wxcc-fs', 'e-fs-el'], text: 'Marcus calls during the storm and Savannah answers.' },
      { nodes: ['el'], edges: [], text: 'He says a line is down by his driveway. Savannah tells him to stay at least 35 feet away.' },
      { nodes: ['el', 'agent'], edges: ['e-el-back'], text: 'Savannah says she is connecting him, then hands the call back to WxCC marked as an emergency outage call.' },
      { nodes: ['agent', 'cis'], edges: ['e-cis-agent'], text: 'He goes first to the outage teams. The agent sees his account, the active outage and what Savannah already collected.' }
    ]},
    { name: '3 · Payment reminders', steps: [
      { nodes: ['sup', 'svc'], edges: [], text: 'The supervisor uploads a list of past-due accounts and picks voice or text.' },
      { nodes: ['svc', 'el'], edges: [], text: 'For voice, Savannah calls each member from 207-531-5136 and reminds them of the past-due amount.' },
      { nodes: ['el', 'svc', 'cis'], edges: ['e-el-svc', 'e-svc-cis'], text: 'She asks "card on file, e-check on file, or a new card?", takes the payment, and notes the outcome.' },
      { nodes: ['svc', 'sms'], edges: ['e-svc-sms'], text: 'For text, each member gets a secure pay link.' },
      { nodes: ['svc'], edges: [], text: 'Every call and text shows on Customer Review: paid, promised, no answer.' }
    ]},
    { name: 'Normal day', steps: [
      { nodes: ['caller', 'wxcc'], edges: ['e-caller-wxcc'], text: 'Savannah is off, so the flow routes the call as it does on any normal day.' },
      { nodes: ['wxcc', 'agent'], edges: ['e-wxcc-agent'], text: 'The call queues to the billing agent.' },
      { nodes: ['agent', 'cis'], edges: ['e-cis-agent'], text: "The member's account shows on the agent's screen with balance, due date, usage and outage status." }
    ]}
  ];

  let sc = 0, st = 0, timer = null;
  const $ = (id) => document.getElementById(id);
  const box = $('scenarios');
  scenarios.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = s.name;
    b.addEventListener('click', () => pick(i));
    box.appendChild(b);
  });

  function pick(i) { stop(); sc = i; st = 0; render(); }
  function render() {
    const s = scenarios[sc], step = s.steps[st];
    [...box.children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === sc)));
    document.querySelectorAll('.node').forEach(n => n.classList.toggle('on', step.nodes.includes(n.id.slice(2))));
    document.querySelectorAll('.edge').forEach(e => e.classList.toggle('on', step.edges.includes(e.id)));
    const cap = $('caption');
    cap.innerHTML = '';
    const eb = document.createElement('span');
    eb.className = 'eyebrow'; eb.textContent = 'Step ' + (st + 1) + ' of ' + s.steps.length;
    cap.append(eb, document.createTextNode(step.text));
    $('dots').innerHTML = s.steps.map((_, i) => '<span class="' + (i === st ? 'on' : '') + '"></span>').join('');
    $('back').disabled = st === 0;
    $('next').disabled = st === s.steps.length - 1;
  }
  function stop() { clearInterval(timer); timer = null; $('play').textContent = 'Play'; }
  function back() { stop(); if (st > 0) { st--; render(); } }
  function next() { stop(); if (st < scenarios[sc].steps.length - 1) { st++; render(); } }
  function play() {
    if (timer) return stop();
    if (st === scenarios[sc].steps.length - 1) st = 0;
    render();
    $('play').textContent = 'Pause';
    timer = setInterval(() => {
      if (st >= scenarios[sc].steps.length - 1) return stop();
      st++; render();
    }, 3600);
  }
  $('back').addEventListener('click', back);
  $('next').addEventListener('click', next);
  $('play').addEventListener('click', play);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
    else if (e.key === ' ') { e.preventDefault(); play(); }
    else if (/^[1-9]$/.test(e.key) && scenarios[+e.key - 1]) pick(+e.key - 1);
  });
  render();
</script>
</body>
</html>
